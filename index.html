<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lalit Gaming & Utility Hub</title><style>body { font-family: "Segoe UI", sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; } .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,255,136,0.2); } h1 { color: #00ff88; } canvas { background: #000; border: 2px solid #00ff88; display: block; margin: 20px auto; border-radius: 8px; } input, button { padding: 10px; margin: 10px; border-radius: 6px; border: none; font-size: 16px; } button { background: #00ff88; color: #121212; font-weight: bold; cursor: pointer; } button:hover { background: #00b362; }</style></head><body><div class="container"><h1>Lalit Official Earning Hub 🚀</h1><p>Play games and use premium tools below!</p><hr style="border-color:#333;"><h3>🎮 Play Snake Game</h3><p>Use On-Screen Buttons or Keyboard arrows to turn.</p><canvas id="gameCanvas" width="300" height="300"></canvas><br><button onclick="changeDir(\x27up\x27\x2gt;Up</button><br><button onclick="changeDir(\x27left\x27\x2gt;Left</button><button onclick="changeDir(\x27right\x27\x2gt;Right</button><br><button onclick="changeDir(\x27down\x27\x2gt;Down</button><hr style="border-color:#333;"><h3>🛠️ Premium Age Calculator</h3><input type="date" id="birthdate"><br><button onclick="calcAge(\x2gt;Calculate Age</button><p id="ageResult" style="color:#00ff88; font-weight:bold;"></p></div><script>const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d");let box=20,snake=[{x:100,y:100}],food={x:Math.floor(Math.random()*15)*box,y:Math.floor(Math.random()*15)*box},d="right";function changeDir(dir){if(dir=="left"&&d!="right")d="left";if(dir=="up"&&d!="down")d="up";if(dir=="right"&&d!="left")d="right";if(dir=="down"&&d!="up")d="down"}function draw(){ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<snake.length;i++){ctx.fillStyle=i==0?"#00ff88":"#00b362";ctx.fillRect(snake[i].x,snake[i].y,box,box)}ctx.fillStyle="red";ctx.fillRect(food.x,food.y,box,box);let snakeX=snake[0].x,snakeY=snake[0].y;if(d=="left")snakeX-=box;if(d=="up")snakeY-=box;if(d=="right")snakeX+=box;if(d=="down")snakeY+=box;if(snakeX==food.x&&snakeY==food.y){food={x:Math.floor(Math.random()*15)*box,y:Math.floor(Math.random()*15)*box}}else{snake.pop()}let newHead={x:snakeX,y:snakeY};if(snakeX<0||snakeX>=canvas.width||snakeY<0||snakeY>=canvas.height||collision(newHead,snake)){clearInterval(game);alert("Game Over! Refresh to restart.")}snake.unshift(newHead)}function collision(head,array){for(let i=0;i<array.length;i++){if(head.x==array[i].x&&head.y==array[i].y)return true}return false}let game=setInterval(draw,150);function calcAge(){const dob=new Date(document.getElementById("birthdate").value);if(!dob)return;const diff=Date.now()-dob.getTime(),ageDate=new Date(diff);document.getElementById("ageResult").innerText="Your Age: "+Math.abs(ageDate.getUTCFullYear()-1970)+" Years";}</script></body></html>
